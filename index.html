<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>じゃんけん</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    .hidden { display: none !important; }
    main { min-height: 0; }
    #gamePlayArea { min-height: 0; gap: .45rem; }

    /* 画像を左に大きく、右側に着用状況、その下寄りに相手の手を配置 */
    #visualRow {
      width: 100%;
      height: min(59dvh, 570px);
      min-height: 280px;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(220px, .85fr);
      grid-template-rows: minmax(0, 1fr) auto;
      gap: .65rem;
      margin: 0 auto;
    }
    #imageFrame {
      grid-column: 1;
      grid-row: 1 / span 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: .65rem;
      box-shadow: 0 1px 3px rgb(15 23 42 / .08);
    }
    #charImage {
      display: block;
      width: auto;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
    #clothingStatus {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      min-width: 0;
      max-height: 100%;
      overflow: auto;
      padding: .7rem .8rem;
      border: 1px solid #e2e8f0;
      border-radius: .65rem;
      background: #fff;
      box-shadow: 0 1px 3px rgb(15 23 42 / .05);
      font-size: .84rem;
      line-height: 1.5;
      color: #475569;
    }
    #clothingStatusLabel {
      display: block;
      margin-bottom: .35rem;
      font-weight: 800;
      color: #334155;
    }
    #clothingStatusItems {
      list-style: disc;
      padding-left: 1.2rem;
      margin: 0;
    }
    #clothingStatusItems li { padding: .04rem 0; overflow-wrap: anywhere; }
    #opponentHandDisplay {
      grid-column: 2;
      grid-row: 2;
      align-self: end;
      justify-self: stretch;
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      padding: .55rem;
      text-align: center;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: .65rem;
      box-shadow: 0 1px 3px rgb(15 23 42 / .05);
    }
    #opponentHandLabel { font-size: .78rem; color: #64748b; font-weight: 700; }
    #opponentHandEmoji { font-size: 2rem; line-height: 1.1; }
    #opponentHandName { font-size: .9rem; font-weight: 800; color: #4338ca; }

    /* キャラ名とコメントは画像の下に横書きでまとめる */
    #dialoguePanel {
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      max-height: 125px;
      min-height: 76px;
      padding: .65rem .85rem;
      display: flex;
      flex-direction: column;
      gap: .3rem;
      overflow: auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: .65rem;
      box-shadow: 0 1px 3px rgb(15 23 42 / .05);
    }
    #charName {
      flex: 0 0 auto;
      color: #4f46e5;
      font-size: .8rem;
      font-weight: 800;
      padding-bottom: .25rem;
      border-bottom: 1px solid #e0e7ff;
    }
    #dialogueText {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: .95rem;
      line-height: 1.55;
      color: #334155;
    }
    #roundInfo { width: 100%; max-width: 760px; margin: .05rem auto 0; flex: 0 0 auto; }
    #roundResultPanel {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      padding: .7rem .85rem;
      background: #fff;
      border: 1px solid #c7d2fe;
      border-radius: .65rem;
      box-shadow: 0 1px 3px rgb(15 23 42 / .05);
    }
    #roundResultTitle { font-size: 1rem; font-weight: 800; color: #334155; }
    #roundResultMessage { font-size: .85rem; line-height: 1.4; color: #64748b; }
    #continueRoundButton { padding: .55rem .8rem; font-size: .88rem; }
    #actionControls { flex: 0 0 auto; padding-top: .2rem; padding-bottom: .1rem; }
    #actionControls .instruction { margin-bottom: .3rem; }
    #actionControls .hand-btn { padding: .55rem .4rem; }
    #actionControls .hand-emoji { font-size: 1.6rem; line-height: 1.1; margin-bottom: .15rem; }
    #resultControls { flex: 0 0 auto; padding: .35rem 0 !important; }
    #loadErrorPanel { white-space: pre-line; }

    @media (max-width: 767px) {
      header { flex: 0 0 auto; padding-top: .38rem !important; padding-bottom: .38rem !important; }
      header #gameTitle { font-size: 1rem; }
      header #hpDisplay { font-size: .75rem; padding: .22rem .45rem; }
      header button { font-size: .7rem !important; padding: .28rem .42rem !important; }
      main { padding: .4rem !important; overflow: hidden; }
      footer { display: none; }
      #modeSelectModal { padding: 1.1rem; }
      #modeSelectModal button { text-align: left; padding-left: .9rem; padding-right: .6rem; }
      #gamePlayArea { flex: 1 1 auto; width: 100%; justify-content: flex-start; gap: .3rem; overflow: hidden; }
      /* スマホも画像を大きく。右側は着用状況を上、相手の手を下に */
      #visualRow {
        flex: 0 0 auto;
        height: min(47dvh, 385px);
        max-height: calc(100dvh - 315px);
        min-height: 180px;
        grid-template-columns: minmax(0, 1fr) 100px;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: .35rem;
      }
      #imageFrame { grid-column: 1; grid-row: 1 / span 2; border-radius: .5rem; }
      #charImage { max-width: 100%; max-height: 100%; }
      #clothingStatus {
        grid-column: 2;
        grid-row: 1;
        padding: .35rem .4rem;
        font-size: .7rem;
        line-height: 1.35;
        border-radius: .5rem;
      }
      #clothingStatusLabel { margin-bottom: .18rem; font-size: .7rem; }
      #clothingStatusItems { padding-left: 1rem; }
      #clothingStatusItems li { padding: .025rem 0; }
      #opponentHandDisplay {
        grid-column: 2;
        grid-row: 2;
        flex-direction: column;
        gap: .15rem;
        padding: .3rem .2rem;
        border-radius: .5rem;
      }
      #opponentHandLabel { font-size: .65rem; line-height: 1.25; }
      #opponentHandEmoji { font-size: 1.55rem; }
      #opponentHandName { font-size: .75rem; }
      #dialoguePanel {
        max-height: 92px;
        min-height: 65px;
        padding: .4rem .55rem;
        gap: .18rem;
        border-radius: .5rem;
      }
      #charName { font-size: .7rem; padding-bottom: .15rem; }
      #dialogueText { font-size: .8rem; line-height: 1.4; }
      #roundInfo { margin-top: 0; }
      #roundResultPanel { gap: .2rem; padding: .45rem .55rem; }
      #roundResultTitle { font-size: .88rem; }
      #roundResultMessage { font-size: .72rem; }
      #continueRoundButton { padding: .38rem .5rem; font-size: .77rem; }
      #actionControls { width: 100%; max-width: none; padding-top: .1rem; }
      #actionControls .instruction { margin-bottom: .2rem; font-size: .72rem; }
      #actionControls .hand-btn { padding: .38rem .18rem; }
      #actionControls .hand-emoji { font-size: 1.35rem; margin-bottom: .05rem; }
      #actionControls .hand-label { font-size: .72rem; }
      #resultControls { padding: .15rem 0 !important; }
    }
    @media (max-width: 360px) {
      #visualRow { grid-template-columns: minmax(0, 1fr) 86px; }
      #clothingStatus { padding: .3rem .3rem; font-size: .67rem; }
      #clothingStatusLabel { font-size: .67rem; }
      #opponentHandEmoji { font-size: 1.4rem; }
      #dialoguePanel { max-height: 88px; }
      #dialogueText { font-size: .76rem; }
    }
    @media (max-height: 650px) and (max-width: 767px) {
      #visualRow { height: min(39dvh, 275px); max-height: calc(100dvh - 270px); min-height: 155px; }
      #clothingStatus { padding-top: .23rem; padding-bottom: .23rem; }
      #actionControls .hand-btn { padding: .25rem .15rem; }
      #actionControls .hand-emoji { font-size: 1.15rem; }
      #dialoguePanel { min-height: 55px; max-height: 76px; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col justify-between font-sans">
  <header class="bg-white border-b border-slate-200 py-3 px-4 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 id="gameTitle" class="text-lg font-bold text-slate-700">じゃんけん</h1>
      <div class="flex items-center space-x-3">
        <div id="hpDisplay" class="text-sm font-semibold text-rose-600 bg-rose-50 px-3 py-1 rounded-full border border-rose-200">HP: <span id="hpValue">♥♥♥</span></div>
        <button onclick="resetGame()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-2.5 py-1.5 rounded transition">最初から</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center items-center">
    <div id="loadingPanel" class="bg-white border border-slate-200 rounded-xl p-6 shadow-md max-w-sm w-full text-center space-y-3">
      <h2 class="text-lg font-bold text-slate-800">データを読み込み中</h2>
      <p id="loadingStatus" class="text-sm text-slate-500">CSVと画像を確認しています…</p>
    </div>

    <div id="loadErrorPanel" class="hidden bg-white border border-rose-200 rounded-xl p-6 shadow-md max-w-lg w-full text-left">
      <h2 class="text-lg font-bold text-rose-700 mb-2">ゲームデータを読み込めませんでした</h2>
      <p id="loadErrorMessage" class="text-sm text-slate-700"></p>
      <p class="text-xs text-slate-500 mt-3">data.csv と画像ファイルを index.html と同じフォルダーに置き、ローカルサーバー経由で開いてください。</p>
    </div>

    <div id="modeSelectModal" class="hidden bg-white border border-slate-200 rounded-xl p-6 shadow-md max-w-sm w-full text-center space-y-4 my-auto">
      <h2 class="text-xl font-bold text-slate-800">モードを選択</h2>
      <p class="text-xs text-slate-500">プレイするモードを選んでください。</p>
      <p id="preloadWarning" class="hidden text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded p-2 text-left"></p>
      <div class="space-y-3 pt-2">
        <button onclick="startGame('normal')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition text-sm text-left">通常モード (HP : 3)</button>
        <button onclick="startGame('musou')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg shadow transition text-sm text-left">無双モード (HP : 無限・未来予知)</button>
      </div>
    </div>

    <div id="gamePlayArea" class="hidden w-full flex-1 flex flex-col justify-center">
      <div id="visualRow">
        <div id="imageFrame">
          <img id="charImage" alt="キャラクター画像">
        </div>

        <section id="clothingStatus" aria-live="polite" aria-label="現在の着用状態">
          <div id="clothingStatusLabel">現在の着用状態</div>
          <ul id="clothingStatusItems"><li>読み込み中</li></ul>
        </section>

        <div id="opponentHandDisplay" aria-live="polite" aria-label="相手の手">
          <div id="opponentHandLabel">相手の手</div>
          <div id="opponentHandEmoji">？</div>
          <div id="opponentHandName">未公開</div>
        </div>
      </div>

      <div id="dialoguePanel">
        <div id="charName">キャラクター</div>
        <div id="dialogueText"></div>
      </div>

      <div id="roundInfo" aria-live="polite">
        <div id="roundResultPanel" class="hidden">
          <div id="roundResultTitle">勝敗</div>
          <div id="roundResultMessage"></div>
          <button id="continueRoundButton" onclick="continueAfterRound()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition">次の勝負へ</button>
        </div>
      </div>

      <div id="actionControls" class="w-full max-w-md mx-auto">
        <div class="instruction text-center text-xs text-slate-400 font-medium">手を選択</div>
        <div class="grid grid-cols-3 gap-3">
          <button class="hand-btn bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-lg shadow border-b-2 border-rose-700 active:translate-y-0.5 transition flex flex-col items-center" onclick="playHand('rock')"><span class="hand-emoji">✊</span><span class="hand-label">グー</span></button>
          <button class="hand-btn bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg shadow border-b-2 border-amber-700 active:translate-y-0.5 transition flex flex-col items-center" onclick="playHand('scissors')"><span class="hand-emoji">✌️</span><span class="hand-label">チョキ</span></button>
          <button class="hand-btn bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg shadow border-b-2 border-emerald-700 active:translate-y-0.5 transition flex flex-col items-center" onclick="playHand('paper')"><span class="hand-emoji">🖐️</span><span class="hand-label">パー</span></button>
        </div>
      </div>

      <div id="resultControls" class="hidden w-full max-w-xs mx-auto text-center">
        <div id="finalResultTitle" class="text-lg font-bold text-slate-700 mb-2"></div>
        <button onclick="resetGame()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition text-sm">もう一度遊ぶ</button>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-2 text-center text-xs text-slate-400">&copy; じゃんけんゲーム</footer>

  <script>
    let gameMode = 'normal';
    let currentHp = 3;
    let currentStage = 0;
    let maxStage = 5;
    let csvDatabase = {};
    let preloadedImages = new Map();
    let failedImages = [];
    let currentOpponentHand = null;
    let handRevealed = false;
    let roundPending = false;
    let pendingOutcome = null;
    let gameFinished = false;
    let remainingClothing = [];
    let processedClothingStages = new Set();

    const HANDS = ['rock', 'scissors', 'paper'];
    const HAND_LABELS = {
      rock: { name: 'グー', emoji: '✊' },
      scissors: { name: 'チョキ', emoji: '✌️' },
      paper: { name: 'パー', emoji: '🖐️' }
    };

    function splitItems(value) {
      return String(value || '').split('|').map(item => item.trim()).filter(Boolean);
    }

    function parseCSVRecords(csvText) {
      const text = csvText.replace(/^\uFEFF/, '');
      const records = [];
      let record = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i + 1] === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else if (ch === '"' && field.length === 0) {
          inQuotes = true;
        } else if (ch === ',') {
          record.push(field.trim());
          field = '';
        } else if (ch === '\n') {
          record.push(field.trim());
          if (record.some(value => value !== '')) records.push(record);
          record = [];
          field = '';
        } else if (ch !== '\r') {
          field += ch;
        }
      }
      record.push(field.trim());
      if (record.some(value => value !== '')) records.push(record);
      return records;
    }

    function parseCSV(csvText) {
      const records = parseCSVRecords(csvText);
      const headerIndex = records.findIndex(record => {
        const headers = record.map(value => value.trim().toLowerCase());
        return headers.includes('image') && headers.includes('character');
      });
      if (headerIndex < 0) throw new Error('CSVのヘッダー行（image, character）が見つかりません。');

      const headers = records[headerIndex].map(value => value.trim().replace(/^\uFEFF/, ''));
      const requiredHeaders = ['image', 'character', 'mode', 'dialogue', 'dialogue_draw', 'dialogue_win', 'dialogue_lose', 'initial_clothing', 'remove_item'];
      const missingHeaders = requiredHeaders.filter(header => !headers.includes(header));
      if (missingHeaders.length) throw new Error('CSVに必要な列がありません：' + missingHeaders.join(', '));

      const db = {};
      for (const values of records.slice(headerIndex + 1)) {
        const row = {};
        headers.forEach((header, index) => { row[header] = (values[index] || '').trim(); });
        const filename = row.image;
        if (!filename || !/\.(png|jpe?g|webp)$/i.test(filename)) continue;
        db[filename] = row;
      }
      if (Object.keys(db).length === 0) throw new Error('CSVに画像データが登録されていません。');
      if (!db['000.png']) throw new Error('開始画像 000.png がCSVに登録されていません。');

      const initialItems = splitItems(db['000.png'].initial_clothing);
      if (initialItems.length === 0) throw new Error('000.png の initial_clothing に初期の着用状態を登録してください。');
      const knownItems = new Set(initialItems);
      for (const [filename, row] of Object.entries(db)) {
        const unknownItems = splitItems(row.remove_item).filter(item => !knownItems.has(item));
        if (unknownItems.length) {
          throw new Error(`${filename} の remove_item に初期着用リストにない項目があります：${unknownItems.join('、')}`);
        }
      }
      return db;
    }

    async function preloadAllImages() {
      const filenames = Object.keys(csvDatabase);
      let completed = 0;
      const loadingStatus = document.getElementById('loadingStatus');
      await Promise.all(filenames.map(filename => new Promise(resolve => {
        const img = new Image();
        preloadedImages.set(filename, img);
        img.onload = () => {
          completed++;
          loadingStatus.textContent = `画像を先読み中… ${completed}/${filenames.length}`;
          resolve();
        };
        img.onerror = () => {
          failedImages.push(filename);
          completed++;
          loadingStatus.textContent = `画像を先読み中… ${completed}/${filenames.length}`;
          resolve();
        };
        img.src = filename;
      })));
    }

    async function loadCSVData() {
      const response = await fetch('data.csv', { cache: 'no-cache' });
      if (!response.ok) throw new Error(`data.csv の読み込みに失敗しました（HTTP ${response.status}）。`);
      csvDatabase = parseCSV(await response.text());

      const stageKeys = Object.keys(csvDatabase)
        .map(filename => parseInt(filename.replace(/\.(png|jpe?g|webp)$/i, ''), 10))
        .filter(number => Number.isInteger(number) && number < 100);
      if (stageKeys.length === 0) throw new Error('CSVからステージ番号を判断できませんでした。');
      maxStage = Math.max(...stageKeys);

      document.getElementById('loadingStatus').textContent = `画像を先読み中… 0/${Object.keys(csvDatabase).length}`;
      await preloadAllImages();
    }

    function randomHand() {
      return HANDS[Math.floor(Math.random() * HANDS.length)];
    }

    function setCharacterImage(filename) {
      const img = document.getElementById('charImage');
      img.onerror = () => {
        img.onerror = null;
        const safeFilename = filename.replace(/[<>&"']/g, '');
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="440" viewBox="0 0 300 440"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#64748b">画像がありません</text><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">${safeFilename}</text></svg>`;
        img.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
      };
      const preloaded = preloadedImages.get(filename);
      img.src = preloaded && preloaded.complete && preloaded.naturalWidth > 0 ? preloaded.src : filename;
    }

    function updateClothingForStage(filename, data) {
      if (processedClothingStages.has(filename)) return;
      splitItems(data.remove_item).forEach(item => {
        const index = remainingClothing.indexOf(item);
        if (index >= 0) remainingClothing.splice(index, 1);
      });
      processedClothingStages.add(filename);
      renderClothingStatus();
    }

    function renderClothingStatus() {
      const container = document.getElementById('clothingStatusItems');
      container.replaceChildren();
      if (remainingClothing.length) {
        remainingClothing.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          container.appendChild(li);
        });
      } else {
        const li = document.createElement('li');
        li.textContent = '着用しているものはありません';
        container.appendChild(li);
      }
    }

    function startGame(mode) {
      if (!Object.keys(csvDatabase).length) return;
      gameMode = mode;
      currentHp = mode === 'musou' ? Infinity : 3;
      currentStage = 0;
      currentOpponentHand = randomHand();
      handRevealed = mode === 'musou';
      roundPending = false;
      pendingOutcome = null;
      gameFinished = false;
      remainingClothing = splitItems(csvDatabase['000.png'].initial_clothing);
      processedClothingStages = new Set();

      document.getElementById('modeSelectModal').classList.add('hidden');
      document.getElementById('gamePlayArea').classList.remove('hidden');
      document.getElementById('actionControls').classList.remove('hidden');
      document.getElementById('resultControls').classList.add('hidden');
      document.getElementById('roundResultPanel').classList.add('hidden');
      renderClothingStatus();
      updateUI();
    }

    function updateUI() {
      document.getElementById('hpValue').textContent = gameMode === 'musou'
        ? '無限 (∞)'
        : '♥'.repeat(Math.max(0, currentHp));

      const isGameOver = gameMode !== 'musou' && currentHp <= 0;
      const imgFilename = isGameOver ? '100.png' : String(currentStage).padStart(3, '0') + '.png';
      const data = csvDatabase[imgFilename];
      if (!data) {
        showLoadError(`CSVに ${imgFilename} のデータがありません。ステージ用画像の登録を確認してください。`);
        return;
      }

      if (!isGameOver) updateClothingForStage(imgFilename, data);
      setCharacterImage(imgFilename);
      document.getElementById('charName').textContent = data.character || 'キャラクター';
      document.getElementById('dialogueText').textContent = data.dialogue || '';

      gameFinished = isGameOver || currentStage >= maxStage;
      roundPending = false;
      pendingOutcome = null;
      document.getElementById('actionControls').classList.toggle('hidden', gameFinished);
      document.getElementById('resultControls').classList.toggle('hidden', !gameFinished);
      document.getElementById('roundResultPanel').classList.add('hidden');
      document.getElementById('finalResultTitle').textContent = isGameOver ? 'ゲームオーバー' : 'クリア！';
      renderOpponentHand();
    }

    function renderOpponentHand() {
      const emoji = document.getElementById('opponentHandEmoji');
      const name = document.getElementById('opponentHandName');
      const label = document.getElementById('opponentHandLabel');
      if (gameFinished) {
        label.textContent = '相手の手';
        emoji.textContent = '—';
        name.textContent = '勝負終了';
        return;
      }
      const reveal = handRevealed || roundPending || gameMode === 'musou';
      if (reveal && currentOpponentHand) {
        const hand = HAND_LABELS[currentOpponentHand];
        emoji.textContent = hand.emoji;
        name.textContent = hand.name;
        label.textContent = gameMode === 'musou' && !roundPending ? '未来予知' : '相手の手';
      } else {
        emoji.textContent = '？';
        name.textContent = '未公開';
        label.textContent = '相手の手';
      }
    }

    function getCurrentStageData() {
      const filename = String(currentStage).padStart(3, '0') + '.png';
      return csvDatabase[filename] || {};
    }

    function showRoundResult(title, message, buttonLabel) {
      document.getElementById('roundResultTitle').textContent = title;
      document.getElementById('roundResultMessage').textContent = message;
      document.getElementById('continueRoundButton').textContent = buttonLabel;
      document.getElementById('roundResultPanel').classList.remove('hidden');
      document.getElementById('actionControls').classList.add('hidden');
      renderOpponentHand();
    }

    function playHand(playerHand) {
      if (gameFinished || roundPending || currentHp <= 0 || currentStage >= maxStage || !currentOpponentHand) return;

      const opponentHand = currentOpponentHand;
      handRevealed = true;
      roundPending = true;
      const isDraw = playerHand === opponentHand;
      const isPlayerWin = !isDraw && (
        (playerHand === 'rock' && opponentHand === 'scissors') ||
        (playerHand === 'scissors' && opponentHand === 'paper') ||
        (playerHand === 'paper' && opponentHand === 'rock')
      );
      const stageData = getCurrentStageData();

      if (isDraw) {
        pendingOutcome = 'draw';
        document.getElementById('dialogueText').textContent = stageData.dialogue_draw || 'あいこ！もう一度勝負！';
        showRoundResult('あいこ！', '同じ手でした。もう一度勝負しましょう。', 'もう一度勝負');
        return;
      }

      if (isPlayerWin) {
        // キャラクターが負けたときのセリフを結果画面で表示する。
        pendingOutcome = 'playerWin';
        document.getElementById('dialogueText').textContent = stageData.dialogue_lose || 'あちゃ〜、負けちゃった……でも次は負けないから！';
        showRoundResult('あなたの勝ち！', '相手が負けました。セリフを確認してから次へ進みます。', '次のステージへ');
        return;
      }

      // キャラクターが勝った（プレイヤーが負けた）ときのセリフ。
      pendingOutcome = 'playerLose';
      if (gameMode !== 'musou') currentHp--;
      document.getElementById('hpValue').textContent = gameMode === 'musou'
        ? '無限 (∞)'
        : '♥'.repeat(Math.max(0, currentHp));
      document.getElementById('dialogueText').textContent = stageData.dialogue_win || 'ふふっ、私の勝ち！もう一回勝負！';

      const gameOverNext = gameMode !== 'musou' && currentHp <= 0;
      showRoundResult(
        'あなたの負け…',
        gameOverNext ? 'HPがなくなりました。結果を確認しましょう。' : '相手はもう一度勝負したそうです。',
        gameOverNext ? '結果を見る' : 'もう一度勝負'
      );
    }

    function continueAfterRound() {
      if (!roundPending || !pendingOutcome) return;
      const outcome = pendingOutcome;
      roundPending = false;
      pendingOutcome = null;
      document.getElementById('roundResultPanel').classList.add('hidden');

      if (outcome === 'playerWin') {
        currentStage++;
        currentOpponentHand = randomHand();
        handRevealed = gameMode === 'musou';
        updateUI();
        return;
      }

      if (outcome === 'playerLose' && gameMode !== 'musou' && currentHp <= 0) {
        handRevealed = false;
        updateUI();
        return;
      }

      // あいこ、またはHPが残っている敗北：同じステージで次の勝負へ。
      currentOpponentHand = randomHand();
      handRevealed = gameMode === 'musou';
      document.getElementById('actionControls').classList.remove('hidden');
      renderOpponentHand();
    }

    function showLoadError(message) {
      document.getElementById('loadingPanel').classList.add('hidden');
      document.getElementById('modeSelectModal').classList.add('hidden');
      document.getElementById('gamePlayArea').classList.add('hidden');
      document.getElementById('loadErrorPanel').classList.remove('hidden');
      document.getElementById('loadErrorMessage').textContent = message;
    }

    function resetGame() {
      roundPending = false;
      pendingOutcome = null;
      document.getElementById('modeSelectModal').classList.remove('hidden');
      document.getElementById('gamePlayArea').classList.add('hidden');
      document.getElementById('roundResultPanel').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await loadCSVData();
        document.getElementById('loadingPanel').classList.add('hidden');
        if (failedImages.length) {
          const warning = document.getElementById('preloadWarning');
          warning.textContent = '次の画像を読み込めませんでした。ファイル名と配置を確認してください：' + failedImages.join('、');
          warning.classList.remove('hidden');
        }
        document.getElementById('modeSelectModal').classList.remove('hidden');
      } catch (error) {
        console.error(error);
        showLoadError(error instanceof Error ? error.message : '不明なエラーが発生しました。');
      }
    });
  </script>
</body>
</html>
