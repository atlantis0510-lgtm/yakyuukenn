<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>野球拳じゃんけんゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .writing-vertical { writing-mode: vertical-rl; text-orientation: upright; }
        .hidden { display: none !important; }

        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
        }
        main { min-height: 0; }
        #gamePlayArea { min-height: 0; }
        #visualRow { min-width: 0; }
        #imageFrame { aspect-ratio: 13 / 19; }
        #charImage { width: 100%; height: 100%; object-fit: contain; }
        #dialoguePanel { min-width: 0; }
        #dialogueText { overflow-wrap: anywhere; }
        #roundInfo {
            width: 100%;
            max-width: 640px;
            margin: .5rem auto 0;
            display: flex;
            flex-direction: column;
            gap: .2rem;
            text-align: center;
            font-size: .875rem;
        }
        #opponentHandDisplay, #lastRoundDisplay {
            border-radius: .5rem;
            padding: .35rem .65rem;
            background: #fff;
            border: 1px solid #e2e8f0;
        }
        #opponentHandDisplay { font-weight: 700; color: #4338ca; }
        #lastRoundDisplay { color: #475569; }
        #loadErrorPanel { white-space: pre-line; }

        @media (max-width: 767px) {
            header { flex-shrink: 0; padding-top: .45rem !important; padding-bottom: .45rem !important; }
            header #gameTitle { font-size: .95rem; }
            header #hpDisplay { font-size: .75rem; padding: .25rem .5rem; }
            header button { font-size: .7rem !important; padding: .3rem .45rem !important; }
            main { padding: .5rem !important; overflow: hidden; }
            footer { display: none; }
            #modeSelectModal { padding: 1.25rem; }
            #gamePlayArea {
                flex: 1 1 auto;
                justify-content: flex-start;
                gap: .35rem;
                overflow: hidden;
            }
            #visualRow {
                display: grid !important;
                grid-template-columns: minmax(0, .92fr) minmax(0, 1fr);
                align-items: stretch;
                gap: .5rem !important;
                flex: 0 0 auto;
                width: 100%;
                height: min(38dvh, 310px);
                max-height: calc(100dvh - 260px);
                min-height: 190px;
                margin: 0 !important;
                padding: 0 !important;
            }
            #imageFrame {
                width: 100%;
                height: auto;
                max-width: none;
                max-height: 100%;
                aspect-ratio: 13 / 19;
                justify-self: center;
                align-self: center;
                border-radius: .5rem;
            }
            #dialoguePanel {
                width: auto !important;
                max-width: none !important;
                min-width: 0 !important;
                height: 100% !important;
                min-height: 0;
                padding: .6rem !important;
                overflow: hidden;
                border-radius: .5rem;
            }
            #charName {
                flex: 0 0 auto;
                font-size: .72rem;
                padding: 0 0 .35rem 0 !important;
                margin: 0 0 .35rem 0 !important;
                border-right: 0 !important;
                border-bottom: 1px solid #e0e7ff !important;
                writing-mode: horizontal-tb !important;
            }
            #dialogueText {
                writing-mode: horizontal-tb !important;
                height: auto !important;
                min-height: 0;
                padding-top: 0 !important;
                font-size: clamp(.78rem, 2.1dvh, .9rem) !important;
                line-height: 1.55;
                overflow-y: auto;
            }
            #roundInfo {
                margin: .15rem auto 0;
                flex: 0 0 auto;
                gap: .2rem;
                font-size: .76rem;
                line-height: 1.35;
            }
            #opponentHandDisplay, #lastRoundDisplay { padding: .3rem .45rem; }
            #actionControls {
                flex: 0 0 auto;
                width: 100%;
                max-width: none;
                padding-top: .2rem !important;
                padding-bottom: .2rem !important;
            }
            #actionControls .hand-btn { padding: .45rem .2rem !important; }
            #actionControls .hand-emoji { font-size: 1.35rem; margin-bottom: .1rem !important; }
            #actionControls .hand-label { font-size: .7rem; }
            #actionControls .instruction { margin-bottom: .25rem; font-size: .7rem; }
            #resultControls { flex: 0 0 auto; padding: .3rem 0 !important; }
        }

        @media (max-width: 360px) {
            #visualRow { grid-template-columns: minmax(0, .85fr) minmax(0, 1fr); gap: .35rem !important; }
            #dialoguePanel { padding: .45rem !important; }
            #dialogueText { font-size: .75rem !important; }
            #roundInfo { font-size: .7rem; }
        }

        @media (max-height: 560px) and (max-width: 767px) {
            #visualRow { height: 32dvh; min-height: 155px; max-height: calc(100dvh - 225px); }
            #actionControls .hand-btn { padding: .3rem .15rem !important; }
            #actionControls .hand-emoji { font-size: 1.15rem; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col justify-between font-sans">
    <header class="bg-white border-b border-slate-200 py-3 px-4 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 id="gameTitle" class="text-lg font-bold text-slate-700">野球拳じゃんけん</h1>
            <div class="flex items-center space-x-3">
                <div id="hpDisplay" class="text-sm font-semibold text-rose-600 bg-rose-50 px-3 py-1 rounded-full border border-rose-200">
                    HP: <span id="hpValue">♥♥♥</span>
                </div>
                <button onclick="resetGame()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-2.5 py-1.5 rounded transition">最初から</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center items-center">
        <div id="loadingPanel" class="bg-white border border-slate-200 rounded-xl p-6 shadow-md max-w-sm w-full text-center space-y-3">
            <h2 class="text-lg font-bold text-slate-800">データを読み込み中</h2>
            <p id="loadingStatus" class="text-sm text-slate-500">CSVと画像を確認しています…</p>
        </div>

        <div id="loadErrorPanel" class="hidden bg-white border border-rose-200 rounded-xl p-6 shadow-md max-w-lg w-full text-left">
            <h2 class="text-lg font-bold text-rose-700 mb-2">ゲームデータを読み込めませんでした</h2>
            <p id="loadErrorMessage" class="text-sm text-slate-700"></p>
            <p class="text-xs text-slate-500 mt-3">data.csv と画像ファイルを index.html と同じフォルダーに置き、ローカルサーバー経由で開いてください。</p>
        </div>

        <div id="modeSelectModal" class="hidden bg-white border border-slate-200 rounded-xl p-6 shadow-md max-w-sm w-full text-center space-y-4 my-auto">
            <h2 class="text-xl font-bold text-slate-800">難易度を選択</h2>
            <p class="text-xs text-slate-500">プレイするモードを選んでください。</p>
            <p id="preloadWarning" class="hidden text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded p-2 text-left"></p>
            <div class="space-y-3 pt-2">
                <button onclick="startGame('normal')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition text-sm">通常モード (HP : 3)</button>
                <button onclick="startGame('musou')" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg shadow transition text-sm">無双モード (HP : 無限・未来予知)</button>
            </div>
        </div>

        <div id="gamePlayArea" class="hidden w-full flex-1 flex flex-col justify-center">
            <div id="visualRow" class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 my-auto py-2">
                <div id="imageFrame" class="w-full max-w-[320px] md:max-w-[380px] bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden flex items-center justify-center relative">
                    <img id="charImage" alt="キャラクター画像" class="w-full h-full object-contain">
                </div>
                <div id="dialoguePanel" class="w-full max-w-[320px] md:w-auto md:min-w-[200px] md:h-[400px] bg-white border border-slate-200 rounded-lg p-4 shadow-sm flex flex-col justify-start">
                    <div id="charName" class="text-xs font-bold text-indigo-600 border-b border-indigo-100 pb-1 mb-2 md:mb-0 md:border-b-0 md:border-r md:border-indigo-100 md:pb-0 md:pr-2 md:writing-vertical">キャラクター</div>
                    <div id="dialogueText" class="text-sm md:text-base font-medium text-slate-700 leading-relaxed md:writing-vertical md:h-full pt-1"> </div>
                </div>
            </div>

            <div id="roundInfo" aria-live="polite">
                <div id="opponentHandDisplay">相手の手：？？？</div>
                <div id="lastRoundDisplay" class="hidden"></div>
            </div>

            <div id="actionControls" class="w-full max-w-md mx-auto pt-2 pb-4">
                <div class="instruction text-center text-xs text-slate-400 mb-2 font-medium">手を選んでね</div>
                <div class="grid grid-cols-3 gap-3">
                    <button class="hand-btn py-3 px-2 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-lg shadow border-b-2 border-rose-700 active:translate-y-0.5 transition flex flex-col items-center" onclick="playHand('rock')">
                        <span class="hand-emoji text-2xl mb-1">✊</span><span class="hand-label text-xs">グー</span>
                    </button>
                    <button class="hand-btn py-3 px-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg shadow border-b-2 border-amber-700 active:translate-y-0.5 transition flex flex-col items-center" onclick="playHand('scissors')">
                        <span class="hand-emoji text-2xl mb-1">✌️</span><span class="hand-label text-xs">チョキ</span>
                    </button>
                    <button class="hand-btn py-3 px-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg shadow border-b-2 border-emerald-700 active:translate-y-0.5 transition flex flex-col items-center" onclick="playHand('paper')">
                        <span class="hand-emoji text-2xl mb-1">🖐️</span><span class="hand-label text-xs">パー</span>
                    </button>
                </div>
            </div>

            <div id="resultControls" class="hidden w-full max-w-xs mx-auto py-4 text-center">
                <button onclick="resetGame()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition text-sm">もう一度遊ぶ</button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-2 text-center text-xs text-slate-400">&copy; じゃんけんゲーム</footer>

    <script>
        // ゲーム状態
        let gameMode = 'normal';
        let currentHp = 3;
        let currentStage = 0;
        let maxStage = 5;
        let csvDatabase = {};
        let preloadedImages = new Map();
        let failedImages = [];
        let currentOpponentHand = null;
        let lastOpponentHand = null;
        let lastRoundOutcome = '';
        let gameFinished = false;

        const HANDS = ['rock', 'scissors', 'paper'];
        const HAND_LABELS = {
            rock: { name: 'グー', emoji: '✊' },
            scissors: { name: 'チョキ', emoji: '✌️' },
            paper: { name: 'パー', emoji: '🖐️' }
        };

        // 引用符で囲まれたカンマにも対応するCSVパーサー
        function parseCSVRecords(csvText) {
            const text = csvText.replace(/^\uFEFF/, '');
            const records = [];
            let record = [];
            let field = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"' && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        field += ch;
                    }
                } else if (ch === '"' && field.length === 0) {
                    inQuotes = true;
                } else if (ch === ',') {
                    record.push(field.trim());
                    field = '';
                } else if (ch === '\n') {
                    record.push(field.trim());
                    if (record.some(value => value !== '')) records.push(record);
                    record = [];
                    field = '';
                } else if (ch !== '\r') {
                    field += ch;
                }
            }
            record.push(field.trim());
            if (record.some(value => value !== '')) records.push(record);
            return records;
        }

        function parseCSV(csvText) {
            const records = parseCSVRecords(csvText);
            const headerIndex = records.findIndex(record => {
                const headers = record.map(value => value.trim().toLowerCase());
                return headers.includes('image') && headers.includes('character');
            });
            if (headerIndex < 0) throw new Error('CSVのヘッダー行（image, character）が見つかりません。');

            const headers = records[headerIndex].map(value => value.trim().replace(/^\uFEFF/, ''));
            const requiredHeaders = ['image', 'character', 'mode', 'dialogue', 'dialogue_draw', 'dialogue_win'];
            const missingHeaders = requiredHeaders.filter(header => !headers.includes(header));
            if (missingHeaders.length) {
                throw new Error('CSVに必要な列がありません：' + missingHeaders.join(', '));
            }

            const db = {};
            for (const values of records.slice(headerIndex + 1)) {
                const row = {};
                headers.forEach((header, index) => { row[header] = (values[index] || '').trim(); });
                const filename = row.image;
                if (!filename || !/\.(png|jpe?g|webp)$/i.test(filename)) continue;
                db[filename] = row;
            }
            if (Object.keys(db).length === 0) throw new Error('CSVに画像データが登録されていません。');
            if (!db['000.png']) throw new Error('開始画像 000.png がCSVに登録されていません。');
            return db;
        }

        async function preloadAllImages() {
            const filenames = Object.keys(csvDatabase);
            let completed = 0;
            const loadingStatus = document.getElementById('loadingStatus');

            await Promise.all(filenames.map(filename => new Promise(resolve => {
                const img = new Image();
                preloadedImages.set(filename, img);
                img.onload = () => {
                    completed++;
                    loadingStatus.textContent = `画像を先読み中… ${completed}/${filenames.length}`;
                    resolve();
                };
                img.onerror = () => {
                    failedImages.push(filename);
                    completed++;
                    loadingStatus.textContent = `画像を先読み中… ${completed}/${filenames.length}`;
                    resolve();
                };
                img.src = filename;
            })));
        }

        async function loadCSVData() {
            const response = await fetch('data.csv', { cache: 'no-cache' });
            if (!response.ok) throw new Error(`data.csv の読み込みに失敗しました（HTTP ${response.status}）。`);
            const csvText = await response.text();
            csvDatabase = parseCSV(csvText);

            const stageKeys = Object.keys(csvDatabase)
                .map(filename => parseInt(filename.replace(/\.(png|jpe?g|webp)$/i, ''), 10))
                .filter(number => Number.isInteger(number) && number < 100);
            if (stageKeys.length === 0) throw new Error('CSVからステージ番号を判断できませんでした。');
            maxStage = Math.max(...stageKeys);

            document.getElementById('loadingStatus').textContent = `画像を先読み中… 0/${Object.keys(csvDatabase).length}`;
            await preloadAllImages();
        }

        function randomHand() {
            return HANDS[Math.floor(Math.random() * HANDS.length)];
        }

        function imageFilenameForCurrentState() {
            if (gameMode !== 'musou' && currentHp <= 0) return '100.png';
            return String(currentStage).padStart(3, '0') + '.png';
        }

        function setCharacterImage(filename) {
            const img = document.getElementById('charImage');
            img.onerror = () => {
                img.onerror = null;
                const safeFilename = filename.replace(/[<>&"']/g, '');
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="440" viewBox="0 0 300 440"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#64748b">画像がありません</text><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">${safeFilename}</text></svg>`;
                img.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
            };
            img.src = filename;
        }

        function startGame(mode) {
            if (!Object.keys(csvDatabase).length) return;
            gameMode = mode;
            currentHp = mode === 'musou' ? Infinity : 3;
            currentStage = 0;
            lastOpponentHand = null;
            lastRoundOutcome = '';
            gameFinished = false;
            currentOpponentHand = randomHand();

            document.getElementById('modeSelectModal').classList.add('hidden');
            document.getElementById('gamePlayArea').classList.remove('hidden');
            document.getElementById('actionControls').classList.remove('hidden');
            document.getElementById('resultControls').classList.add('hidden');
            updateUI();
        }

        function updateUI() {
            const hpEl = document.getElementById('hpValue');
            hpEl.textContent = gameMode === 'musou' ? '無限 (∞)' : '♥'.repeat(Math.max(0, currentHp));

            const isGameOver = gameMode !== 'musou' && currentHp <= 0;
            const imgFilename = isGameOver ? '100.png' : String(currentStage).padStart(3, '0') + '.png';
            const data = csvDatabase[imgFilename];
            if (!data) {
                showLoadError(`CSVに ${imgFilename} のデータがありません。ステージ用画像の登録を確認してください。`);
                return;
            }

            setCharacterImage(imgFilename);
            document.getElementById('charName').textContent = data.character || 'キャラクター';
            document.getElementById('dialogueText').textContent = data.dialogue || '';

            gameFinished = isGameOver || currentStage >= maxStage;
            document.getElementById('actionControls').classList.toggle('hidden', gameFinished);
            document.getElementById('resultControls').classList.toggle('hidden', !gameFinished);
            renderRoundInfo();
        }

        function renderRoundInfo() {
            const opponentDisplay = document.getElementById('opponentHandDisplay');
            const lastDisplay = document.getElementById('lastRoundDisplay');

            if (gameFinished) {
                opponentDisplay.textContent = '勝負終了';
            } else if (gameMode === 'musou') {
                opponentDisplay.textContent = `未来予知：相手の手は ${HAND_LABELS[currentOpponentHand].emoji} ${HAND_LABELS[currentOpponentHand].name}`;
            } else {
                opponentDisplay.textContent = '相手の手：？？？（手を選ぶと公開）';
            }

            if (lastOpponentHand && lastRoundOutcome) {
                const hand = HAND_LABELS[lastOpponentHand];
                lastDisplay.textContent = `前回の相手の手：${hand.emoji} ${hand.name} ／ ${lastRoundOutcome}`;
                lastDisplay.classList.remove('hidden');
            } else {
                lastDisplay.textContent = '';
                lastDisplay.classList.add('hidden');
            }
        }

        function getCurrentStageData() {
            const filename = String(currentStage).padStart(3, '0') + '.png';
            return csvDatabase[filename] || {};
        }

        function playHand(playerHand) {
            if (gameFinished || currentHp <= 0 || currentStage >= maxStage || !currentOpponentHand) return;

            const opponentHand = currentOpponentHand;
            lastOpponentHand = opponentHand;
            const isDraw = playerHand === opponentHand;
            const isPlayerWin = !isDraw && (
                (playerHand === 'rock' && opponentHand === 'scissors') ||
                (playerHand === 'scissors' && opponentHand === 'paper') ||
                (playerHand === 'paper' && opponentHand === 'rock')
            );

            const stageData = getCurrentStageData();
            if (isDraw) {
                lastRoundOutcome = 'あいこ';
                document.getElementById('dialogueText').textContent = stageData.dialogue_draw || 'あいこ！もう一度勝負！';
                currentOpponentHand = randomHand();
                renderRoundInfo();
                return;
            }

            if (isPlayerWin) {
                lastRoundOutcome = 'あなたの勝ち';
                currentStage++;
                currentOpponentHand = randomHand();
                updateUI();
                return;
            }

            lastRoundOutcome = '相手の勝ち';
            if (gameMode !== 'musou') currentHp--;

            if (gameMode !== 'musou' && currentHp <= 0) {
                updateUI();
            } else {
                document.getElementById('dialogueText').textContent = stageData.dialogue_win || '私の勝ち！もう一回勝負！';
                currentOpponentHand = randomHand();
                document.getElementById('hpValue').textContent = gameMode === 'musou' ? '無限 (∞)' : '♥'.repeat(Math.max(0, currentHp));
                renderRoundInfo();
            }
        }

        function showLoadError(message) {
            document.getElementById('loadingPanel').classList.add('hidden');
            document.getElementById('modeSelectModal').classList.add('hidden');
            document.getElementById('gamePlayArea').classList.add('hidden');
            document.getElementById('loadErrorPanel').classList.remove('hidden');
            document.getElementById('loadErrorMessage').textContent = message;
        }

        function resetGame() {
            document.getElementById('modeSelectModal').classList.remove('hidden');
            document.getElementById('gamePlayArea').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadCSVData();
                document.getElementById('loadingPanel').classList.add('hidden');
                if (failedImages.length) {
                    const warning = document.getElementById('preloadWarning');
                    warning.textContent = '次の画像を読み込めませんでした。ファイル名と配置を確認してください：' + failedImages.join('、');
                    warning.classList.remove('hidden');
                }
                document.getElementById('modeSelectModal').classList.remove('hidden');
            } catch (error) {
                console.error(error);
                showLoadError(error instanceof Error ? error.message : '不明なエラーが発生しました。');
            }
        });
    </script>
</body>
</html>
